[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governdiff"
version = "0.6.0"
description = "Local-first policy diff and breaking-change detection for governance documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GovernDiff contributors" }]
keywords = ["policy", "governance", "document-diff", "compliance", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: General",
]
dependencies = ["pypdf>=5,<7"]

[project.urls]
Homepage = "https://haiqi825-arch.github.io/governdiff/"
Repository = "https://github.com/haiqi825-arch/governdiff"
Documentation = "https://haiqi825-arch.github.io/governdiff/"
Issues = "https://github.com/haiqi825-arch/governdiff/issues"
Changelog = "https://github.com/haiqi825-arch/governdiff/releases"

[project.scripts]
governdiff = "governdiff.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
