name: Feature request
description: Propose a scoped product or developer-workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user's current workflow and failure mode.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Include frequency, impact, and workarounds if known.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: I considered local-first privacy and deterministic behavior.
          required: true
        - label: I did not include confidential policy text or reviewer data.
          required: true
